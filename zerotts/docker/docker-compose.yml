services:
  zerotts:
    build: .
    container_name: zerotts
    restart: unless-stopped
    ports:
      # Cổng LAN. Điện thoại cùng Wi-Fi vào được nếu firewall Windows cho phép.
      - "7860:7860"
    environment:
      ZEROTTS_THREADS: "2"
      ZEROTTS_CONCURRENCY: "3"
      ZEROTTS_MIN_SEC: "2.0"
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      HF_HOME: /data/hf
      # Tunnel cấp hostname ngẫu nhiên nên không thể whitelist trước.
      GRADIO_ALLOWED_HOSTS: "*"
    volumes:
      # Trọng số ~900 MB tải một lần rồi nằm lại đây, rebuild không tải lại.
      - hf-cache:/data/hf

  # Quick tunnel: URL trycloudflare.com ngẫu nhiên, không cần tài khoản.
  # URL sống cùng container — dừng container là link chết.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zerotts-tunnel
    restart: unless-stopped
    depends_on:
      - zerotts
    command: tunnel --no-autoupdate --url http://zerotts:7860

volumes:
  hf-cache:
